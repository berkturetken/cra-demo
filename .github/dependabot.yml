version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: "-" # default is "/"
    commit-message:
      prefix: "chore: dependabot - "
    cooldown:
      default-days: 14

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: "-" # default is "/"
    commit-message:
      prefix: "chore: dependabot - "
    cooldown:
      default-days: 14
